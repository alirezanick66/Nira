<!doctype html>
<html lang="fa" dir="rtl">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>نیرا | دستیار هوشمند خرید</title>
		<link rel="stylesheet" href="css/style.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap"
			rel="stylesheet" />
	</head>
	<body>
		<!-- المان‌های تزئینی پس‌زمینه -->
		<div class="bg-orb bg-orb--1"></div>
		<div class="bg-orb bg-orb--2"></div>

		<!-- هدر -->
		<header class="site-header">
			<div class="header-inner">
				<div class="header-brand">
					<svg
						class="brand-icon"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round">
						<path
							d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
					</svg>
					<div class="brand-text">
						<span class="brand-name">نیرا</span>
						<span class="brand-tagline">دستیار هوشمند خرید</span>
					</div>
				</div>
				<div class="header-live-dot"></div>
			</div>
		</header>

		<!-- کانتینر اصلی چت -->
		<main class="chat-container" id="chat">
			<!-- پیام‌ها و کارت‌ها توسط JS اینجا رندر می‌شوند -->
		</main>

		<!-- ناحیه ورودی -->
		<footer class="input-area">
			<div class="input-wrapper">
				<input
					type="text"
					id="query-input"
					placeholder="نیازتان را بنویسید... (مثلاً: گوشی گیمینگ زیر ۳۰ میلیون)"
					autocomplete="off" />
				<button id="send-btn">ارسال</button>
			</div>
		</footer>

		<script src="script.js"></script>
	</body>
</html>
