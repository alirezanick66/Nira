<!doctype html>
<html lang="fa" dir="rtl">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>نیرا | دستیار هوشمند خرید</title>
		<link rel="stylesheet" href="css/style.css" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap"
			rel="stylesheet" />
	</head>
	<body class="welcome-mode">
		<!-- هدر (فقط در chat-mode نمایش داده می‌شود) -->
		<header class="site-header">
			<div class="header-inner">
				<div class="header-brand">
					<div class="brand-text">
						<span class="brand-name">نیرا</span>
						<span class="brand-tagline">دستیار هوشمند خرید</span>
					</div>
				</div>
			</div>
		</header>

		<!-- ناحیه چت -->
		<main class="chat-container" id="chat"></main>

		<!-- ناحیه ورودی -->
		<div class="input-area">
			<!-- عنوان خوش‌آمدگویی (فقط در welcome-mode) -->
			<div class="welcome-heading">
				<h1><span>سلام علیرضا</span> آماده‌اید شروع کنیم؟</h1>
			</div>

			<textarea
				id="query-input"
				placeholder="نیازتان را بنویسید... (مثلاً: گوشی گیمینگ زیر ۳۰ میلیون)"
				autocomplete="off"
				rows="1"></textarea>
		</div>

		<script type="module" src="script.js"></script>
	</body>
</html>
