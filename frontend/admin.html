<!doctype html>
<html lang="fa" dir="rtl">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>پنل آنالیتیکس نیرا</title>
		<link rel="stylesheet" href="css/style.css" />
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
		<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
	</head>
	<body class="admin-mode">
		<header class="admin-header">
			<div class="adm-wrap header-inner">
				<div class="header-controls">
					<div class="time-filters">
						<button class="time-filter-btn active" data-days="1">
							امروز
						</button>
						<button class="time-filter-btn" data-days="7">
							۷ روز
						</button>
						<button class="time-filter-btn" data-days="30">
							۳۰ روز
						</button>
					</div>
				</div>
			</div>
		</header>

		<main class="admin-main">
			<div class="adm-wrap">
				<!-- Stats -->
				<div id="stats-grid" class="stats-grid"></div>

				<!-- Charts -->
				<div class="charts-row">
					<div class="chart-card">
						<div class="chart-card-header">
							<div>
								<div class="chart-title">
									کوئری‌ها به تفکیک ساعت
								</div>
							</div>
						</div>
						<div class="chart-wrap">
							<canvas id="bar-chart"></canvas>
						</div>
					</div>

					<div class="chart-card">
						<div class="chart-card-header">
							<div>
								<div class="chart-title">توزیع نیت کاربران</div>
							</div>
						</div>
						<div class="chart-wrap">
							<canvas id="pie-chart"></canvas>
						</div>
					</div>
				</div>

				<!-- Logs -->
				<div class="logs-card">
					<div class="logs-card-header">
						<span class="logs-title">📜 لاگ کوئری‌ها</span>
						<div id="pagination" class="pagination-controls"></div>
					</div>
					<div class="table-wrap">
						<table>
							<thead>
								<tr>
									<th>زمان</th>
									<th>کوئری</th>
									<th>نیت</th>
									<th>مدل</th>
									<th>توکن‌ها</th>
									<th>تأخیر</th>
									<th>وضعیت</th>
									<th>فیلترها</th>
								</tr>
							</thead>
							<tbody id="logs-body"></tbody>
						</table>
					</div>
				</div>
			</div>
		</main>

		<script type="module" src="js/admin/admin.js"></script>
	</body>
</html>
