[project]
name = "nira"
version = "0.1.0"
description = "دستیار هوشمند پیشنهاد محصول"
requires-python = ">=3.13"

dependencies = [
    # --- اعتبارسنجی و تنظیمات ---
    "pydantic",
    "pydantic-settings",
    # --- Scraping ---
    "httpx",
    # --- لاگ‌گذاری ---
    "loguru",
    "arabic-reshaper",
    "python-bidi",
    #---دیتابیس---
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    # --- متفرقه ---
    "tenacity",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
