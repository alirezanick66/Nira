[project]
name = "nira"
version = "0.1.0"
description = "دستیار هوشمند پیشنهاد محصول"
requires-python = ">=3.13"

dependencies = [
    # --- اعتبارسنجی و تنظیمات ---
    "pydantic",
    "pydantic-settings",

    # --- Scraping ---
    "httpx",

    # --- لاگ‌گذاری ---
    "loguru",
    "arabic-reshaper",
    "python-bidi",

    # --- متفرقه ---
    "tenacity",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]