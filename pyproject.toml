[project]
name = "nira"
version = "0.1.0"
description = "دستیار هوشمند پیشنهاد محصول"
requires-python = ">=3.13"

dependencies = [
    # --- اعتبارسنجی و تنظیمات ---
    "pydantic",
    "pydantic-settings",
    # --- Scraping ---
    "httpx",
    # --- لاگ‌گذاری ---
    "loguru",
    "arabic-reshaper",
    "python-bidi",
    #---دیتابیس---
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    #api
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.44.0",
    #---gpt models---
    "groq>=1.1.2",
    "google-genai>=1.73.1",
    # --- متفرقه ---
    "tenacity",
    "qdrant-client>=1.17.1",
    "sentence-transformers>=5.4.1",
    "torch>=2.11.0",
    "numpy>=2.4.4"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
