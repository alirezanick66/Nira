domain_version: "1.0.0"

brands:
    - اپل
    - آیفون
    - ایفون
    - سامسونگ
    - شیائومی
    - هواوی
    - نوکیا
    - وان‌پلاس
    - آنر
    - موتورولا
    - سونی
    - ایسوس
    - گوگل
    - تی‌سی‌ال
    - ریلمی
    - پوکو
    - بلک‌بری

model_prefixes:
    - s
    - a
    - p
    - se
    - note
    - redmi
    - galaxy
    - iphone
    - poco

categories:
    #دسته بندی محصول
    - موبایل

colors:
    - مشکی
    - سفید
    - آبی
    - سبز
    - قرمز
    - طلایی
    - نقره‌ای
    - بنفش
    - صورتی
    - خاکستری
    - زرد
    - نارنجی

os_types:
    - iOS
    - Android

# فقط بخش‌های سخت‌افزاری خاص موبایل
qualitative_mappings:
    price_range:
        #اصلاحات قیمتی موبایل
        flagship: [گران, گرون, پرچم‌دار, پرچمدار, لوکس]
    battery_quality:
        #کیفیت باتری
        poor: [باتری ضعیف]
        excellent: [باتری قوی, باتری بزرگ]
        good: [باتری خوب]
    camera_quality:
        #کیفیت دوربین
        good: [دوربین خوب]
        excellent: [دوربین قوی, دوربین عالی, دوربین حرفه‌ای]

use_case_rules:
    گیمینگ: { ram_gb: { gte: 8 }, tags: [gaming] }
    گیم: { ram_gb: { gte: 8 }, tags: [gaming] }
    بازی: { ram_gb: { gte: 8 }, tags: [gaming] }
    عکاسی: { camera_quality: excellent, tags: [photography] }
    عکس: { camera_quality: good, tags: [photography] }
    فیلمبرداری: { camera_quality: excellent, tags: [photography] }
    دانشجویی: { price_range: budget }
    حرفه‌ای: { price_range: premium }
    سبک: { tags: [lightweight] }

slot_definitions:
    brand:
        type: enum
        negation_aware: true

    price:
        type: range
        operators:
            زیر: "<="
            بالای: ">="
            حدود: approx
            کمتر: "<="
            بیشتر: ">="
        units:
            میلیارد: 1000000000
            میلیون: 1000000
            میلیونی: 1000000
            هزار: 1000
            تومان: 1
            تومن: 1
        window: 3
        cues: [تومان, تومن, میلیون, میلیارد, میلیاردی, هزار, میلیونی]
        pattern: ["op?", "num", "unit?"]

    ram_gb:
        type: scalar
        operators:
            حداقل: ">="
            بالای: ">="
            زیر: "<="
        units:
            گیگابایت: 1
            گیگ: 1
            gb: 1
        window: 3
        cues: ["رم", "ram"]
        pattern: ["cue?", "op?", "num", "unit?"]

    storage_gb:
        type: scalar
        operators:
            حداقل: ">="
            بالای: ">="
        units:
            گیگابایت: 1
            گیگ: 1
            gb: 1
            ترابایت: 1024
            tb: 1024
        window: 3
        cues: ["حافظه", "فضا", "هارد", "storage"]
        pattern: ["cue?", "op?", "num", "unit?"]

conflict_resolution_order:
    #تعیین برنده در تضادها
    - price
    - brand
    - ram_gb
    - storage_gb
    - category
    - price_range
    - camera_quality
    - battery_quality
    - value_for_money
    - tags

value_conflicts:
    battery_quality:
        - [poor, excellent]
        - [poor, good]
    camera_quality:
        - [poor, excellent]
        - [poor, good]

relaxation_order:
    # ترتیب ریلکس کردن فیلترها در صورت ۰ نتیجه (از کم‌اهمیت‌ترین به مهم‌ترین)
    - weight_g
    - battery_mah
    - camera_quality
    - battery_quality
    - storage_gb
    - ram_gb
    - os
    - tags
    - price_range
    - value_for_money
    - price
    - brand

relaxation_mappings:
    # ‫نگاشت شل‌سازی مقادیر (Value Relaxation)
    camera_quality:
        excellent: good
        good: average
    battery_quality:
        excellent: good
        good: average
    price_range:
        budget: mid
        mid: premium
        premium: flagship

    # کلمات تأکیدی و کلیدهای مرتبط برای حفاظت پویا
emphasis_keywords: ["حتماً", "فقط", "الزامی", "باید", "اصلی", "مهم"]
filter_cues:
    os: ["اندروید", "ios", "سیستم عامل"]
    camera_quality: ["دوربین", "عکس", "فیلم"]
    weight_g: ["سبک", "وزن"]
    price: ["قیمت", "بودجه", "ارزان", "ارزون", "گران", "گرون"]
    brand: ["برند", "سامسونگ", "اپل", "شیائومی", "هواوی"]
    ram_gb: ["رم", "ram"]
    storage_gb: ["حافظه", "فضا"]

intent_keywords:
    compare:
        canonical_examples:
            - "فرق این دوتا چیه"
            - "مقایسه کن"
            - "کدومش بهتره"
            - "سامسونگ یا شیائومی"
            - "آیفون یا سامسونگ"
            - "اپل یا شیائومی"
    search:
        canonical_examples:
            - "گوشی سامسونگ زیر ۲۰ میلیون"
            - "آیفون ۱۳ پرو مکس ۲۵۶ گیگ"
            - "گوشی با دوربین عالی"
            - "گوشی گیمینگ با شارژدهی بالا"
            - "گوشی نشون بده"
            - "ارزون ترین آیفون رو بگو"
            - "گران ترین گوشی بازار چیه"

#یکسان سازی اسم برندها
brand_normalization:
    آیفون: اپل
    ایفون: اپل
    اپل: اپل
    apple: اپل
    samsung: سامسونگ
    samsung galaxy: سامسونگ

sort_keywords:
    price:
        asc:
            [
                "ارزون ترین",
                "ارزان ترین",
                "ارزانترین",
                "کمترین قیمت",
                "ارزون تر",
                "ارزان تر",
                "اقتصادی‌تر",
            ]
        desc:
            [
                "گران ترین",
                "گرانترین",
                "بیشترین قیمت",
                "بالا ترین قیمت",
                "'گرون ترین",
                "گرونترین",
                "گرانتر",
                "گرونتر",
                "گرون تر",
                "گران تر",
            ]
    release_year:
        desc: ["جدیدترین", "تازه ترین", "مدل جدید", "۲۰۲۴", "۲۰۲۵"]
        asc: ["قدیمی ترین", "مدل قدیمی"]
    rating:
        desc: ["بهترین امتیاز", "خوش دست ترین", "پرفروش ترین"]
