domain_version: "2.0.0"

brands:
    - اپل
    - آیفون
    - ایفون
    - سامسونگ
    - شیائومی
    - هواوی
    - نوکیا
    - وان‌پلاس
    - آنر
    - موتورولا
    - سونی
    - ایسوس
    - گوگل
    - ریلمی
    - پوکو

categories:
    #دسته بندی محصول
    - موبایل

colors:
    - مشکی
    - سفید
    - آبی
    - سبز
    - قرمز
    - طلایی
    - نقره‌ای
    - بنفش
    - صورتی
    - خاکستری
    - زرد
    - نارنجی

os_types:
    - iOS
    - Android

# فقط بخش‌های سخت‌افزاری خاص موبایل
qualitative_mappings:
    battery_quality:
        #کیفیت باتری
        poor: [باتری ضعیف]
        excellent: [باتری قوی, باتری بزرگ]
        good: [باتری خوب]
    camera_quality:
        #کیفیت دوربین
        good: [دوربین خوب]
        excellent: [دوربین قوی, دوربین عالی, دوربین حرفه‌ای]

use_case_rules:
    گیمینگ: { ram_gb: { gte: 8 }, tags: [gaming] }
    گیم: { ram_gb: { gte: 8 }, tags: [gaming] }
    بازی: { ram_gb: { gte: 8 }, tags: [gaming] }
    عکاسی: { camera_quality: excellent, tags: [photography] }
    عکس: { camera_quality: good, tags: [photography] }
    فیلمبرداری: { camera_quality: excellent, tags: [photography] }
    دانشجویی: { price_range: budget }
    حرفه‌ای: { price_range: premium }
    سبک: { tags: [lightweight] }

slot_definitions:
    brand:
        type: enum
        negation_aware: true

    price:
        type: range
        operators:
            زیر: "<="
            بالای: ">="
            حدود: approx
            کمتر: "<="
            بیشتر: ">="
        units:
            میلیارد: 1000000000
            میلیون: 1000000
            هزار: 1000
            تومان: 1

    ram_gb:
        type: scalar
        operators:
            حداقل: ">="
            بالای: ">="
            زیر: "<="
        units:
            گیگابایت: 1
            گیگ: 1
            gb: 1

    storage_gb:
        type: scalar
        operators:
            حداقل: ">="
            بالای: ">="
        units:
            گیگابایت: 1
            گیگ: 1
            gb: 1
            ترابایت: 1024
            tb: 1024

relaxation_order:
    # ترتیب ریلکس کردن فیلترها در صورت ۰ نتیجه (از کم‌اهمیت‌ترین به مهم‌ترین)
    - weight_g
    - battery_mah
    - camera_quality
    - battery_quality
    - storage_gb
    - ram_gb
    - os
    - tags
    - price_range
    - value_for_money
    - price
    - brand

relaxation_mappings:
    # ‫نگاشت شل‌سازی مقادیر (Value Relaxation)
    camera_quality:
        excellent: good
        good: average
    battery_quality:
        excellent: good
        good: average
    price_range:
        budget: mid
        mid: premium
        premium: flagship

    # کلمات تأکیدی و کلیدهای مرتبط برای حفاظت پویا
emphasis_keywords: ["حتماً", "فقط", "الزامی", "باید", "اصلی", "مهم"]
filter_cues:
    os: ["اندروید", "ios", "سیستم عامل"]
    camera_quality: ["دوربین", "عکس", "فیلم"]
    weight_g: ["سبک", "وزن"]
    price: ["قیمت", "بودجه", "ارزان", "ارزون", "گران", "گرون"]
    brand: ["برند", "سامسونگ", "اپل", "شیائومی", "هواوی"]
    ram_gb: ["رم", "ram"]
    storage_gb: ["حافظه", "فضا"]
