base_version: "2.0.0"

# ──────────────────────────────────────────────────────────────────────────
# 🟢 Fast-Path Greeting
# ──────────────────────────────────────────────────────────────────────────
intent_keywords:
    greeting:
        keywords_fast:
            [
                سلام,
                درود,
                وقت بخیر,
                روز بخیر,
                صبح بخیر,
                شب بخیر,
                خداحافظ,
                خوبی,
                چطوری,
                حالت چطوره,
                احوالت چطوره,
                چه خبر,
                خبری نیست,
                سلامتی,
                مخلصیم,
                ارادت,
                در پناه حق,
                خدا قوت,
            ]
        greeting_responses:
            [
                سلام! چطور می‌تونم کمکتون کنم؟,
                ممنونم، چه کمکی از دستم بر میاد؟,
                سلام، در خدمتم! چه چیزی نیاز دارید؟,
                خوشحالم، بفرمایید چطور راهنماییتون کنم؟,
                ممنون از محبتتون، چه سوالی دارید؟,
            ]

# ──────────────────────────────────────────────────────────────────────────
# 🟢 نگاشت‌های کیفی
# ──────────────────────────────────────────────────────────────────────────
qualitative_mappings:
    price_range:
        budget: [ارزان, ارزان‌تر, ارزون, ارزون‌تر, اقتصادی, بودجه]
        mid: [قیمت مناسب, متوسط, میان‌رده, میان رده]
        flagship: [گران, گرون, پرچم‌دار, پرچمدار, لوکس, premium]
        premium: [بالارده]
    value_for_money:
        excellent: [ارزش خرید بالا]
        good: [به‌صرفه]

# ──────────────────────────────────────────────────────────────────────────
# 🟢 تعریف اسلات‌ها
# ──────────────────────────────────────────────────────────────────────────
slot_definitions:
    category:
        type: enum
        negation_aware: true

# ──────────────────────────────────────────────────────────────────────────
# 🟢 پرامپت‌ها و تمپلیت‌ها (تفکیک کامل Call 1 و Call 2)
# ──────────────────────────────────────────────────────────────────────────
prompts:
    # ‫ مخصوص LLM Call 1 (استخراج نیت/فیلتر)
    system_extract: |
        تو یک موتور استخراج دقیق نیت و فیلتر هستی.
        خروجی تو باید فقط یک JSON معتبر باشد. هیچ متن توضیحی تولید نکن.
        ⚠️ قواعد سخت فیلترها:
        - قیمت (price) همیشه به تومان و عدد صحیح. مثال: {"price": {"<=": 20000000}}
        - price_range فقط از مقادیر: budget | mid | premium | flagship
        - مقادیر کیفی فقط: poor | average | good | excellent | unknown
        - برندها فقط به صورت فارسی کانونیکال (مثلاً "اپل" نه "Apple").
        - فقط فیلترهای صریح درخواست‌شده را برگردان. فیلد خالی یا null نگذار.

    # ‫‫  ‫‫ مخصوص LLM Call 2 (تولید پاسخ نهایی)
    system_base: |
        تو یک دستیار خرید هوشمند، دقیق و همدل هستی.
        تنها از اطلاعات محصولات ارائه‌شده استفاده کن و هرگز اطلاعاتی ساختگی تولید نکن.
        پاسخ تو باید فقط یک JSON با این ساختار دقیق باشد:
        { "product_ids": [int, int], "explanation": "متن", "next_suggestion": "متن" }
        دستورالعمل‌های پاسخ‌دهی:
        1. اگر محصولی تمام معیارهای کاربر را برآورده کرد، آن را با اعتماد به نفس پیشنهاد بده.
        2. اگر هیچ محصولی دقیقاً مطابق معیارها نبود، نزدیک‌ترین گزینه‌ها را پیشنهاد بده و صادقانه بگو کدام معیارها متفاوت هستند.
        3. هرگز نگو «محصولی یافت نشد» مگر اینکه واقعاً لیست محصولات خالی باشد.
        4. توضیحاتت باید کوتاه، شفاف و مفید باشد (حداکثر ۲-۳ جمله).
        5. در next_suggestion، یک فیلتر یا اقدام عملی پیشنهاد بده که کاربر می‌تواند برای بهبود نتایج انجام دهد.

    templates:
        extract: |
            ورودی کاربر: "$query"
            تاریخچه مکالمه: $history
            فیلترهای اعمال‌شده قبلی: $last_filters
            محصولات قبلی: $last_products

            ⚙️ راهنمای دامنه (فقط از این ساختارها استفاده کن):
            $domain_schema

            وظایف تو:
            ۱. نیت کاربر را دقیقاً از بین ["search", "refine", "compare", "general_chat"] انتخاب کن.
            ۲. یک کوئری معنایی تمیز (`semantic_query`) بدون کلمات فیلترساز، اعداد مدل یا حروف اضافه تولید کن.
            ۳. فیلترهای متادیتا (`metadata_filters`) را دقیقاً مطابق ساختار Qdrant استخراج کن.
               - اگر نیت `refine` است، فیلترهای قبلی را با تغییرات جدید ادغام کن و وضعیت نهایی کامل فیلترها را برگردان.
               - اگر تضاد منطقی بین فیلترها دیدی، `has_conflict` را true کن و در `conflict_reason` دلیل را بنویس.
               - مقادیر قیمت (price) را همیشه به تومان (عدد صحیح) تبدیل کن و هرگز فیلد 'unit' اضافه نکن.
               - نام برندها را دقیقاً مطابق لیست مجاز و فقط به صورت فارسی کاننیکال برگردان.
            ۴. اگر کوئری مبهم است یا اطلاعات کلیدی کم است، `needs_clarification` را true کن و در `clarification_question` یک سوال کوتاه بپرس.
            ۵. اگر نیت `general_chat` تشخیص داده شد: `needs_clarification` را false، `semantic_query` را خالی ("") و `clarification_question` را null بگذار.
            ۶. خروجی تو باید فقط یک JSON معتبر مطابق ساختار زیر باشد. هیچ متن اضافی تولید نکن.

            📐 ساختار خروجی (دقیقاً همین JSON را برگردان):
            {
              "intent": "string",
              "semantic_query": "string",
              "metadata_filters": {},
              "needs_clarification": false,
              "clarification_question": "string or null",
              "has_conflict": false,
              "conflict_reason": "string or null"
            }

        search: |
            کاربر به دنبال محصولی با این ویژگی‌هاست: $filters
            محصولات بازیابی‌شده:
            $products
            حداکثر ۲ محصول را پیشنهاد بده و دلیل انتخاب را شفاف توضیح بده.
        compare: |
            کاربر می‌خواهد بین محصولات زیر مقایسه‌ای انجام دهد:
            $products
            تفاوت‌های کلیدی، نقاط قوت هرکدام و یک جمع‌بندی نهایی ارائه بده.
        refine: |
            کاربر نتایج قبلی را اصلاح یا محدودتر کرده است.
            فیلترهای اعمال‌شده نهایی: $filters
            محصولات پیشنهادی قبلی:
            $products
            با توجه به تغییرات درخواست، حداکثر ۲ محصول مرتبط‌تر یا جایگزین پیشنهاد بده و دلیل انطباق را شفاف توضیح بده.
