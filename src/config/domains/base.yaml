base_version: "1.0.0"

negation_keywords:
    #حرف های منفی کننده
    - نه
    - بدون
    - غیر
    - به جز
    - غیر از
    - بجز
    - جز
    - مگر

stop_words_semantic:
    # ‫نشانگرهای قیمت
    - زیر
    - بالای
    - کمتر
    - بیشتر
    - تومان
    - تومن
    - حدود
    - حداقل
    - حداکثر
    - تا
    - الی
    # ‫واحدها
    - میلیون
    - میلیارد
    - تومن
    - هزار
    # ‫کلمات اضافه
    - از
    - ولی
    - اما
    - و

intent_keywords:
    greeting:
        # سلام و احوالپرسی
        keywords_fast:
            [
                "سلام",
                "درود",
                "وقت بخیر",
                "روز بخیر",
                "صبح بخیر",
                "شب بخیر",
                "خداحافظ",
            ]
        canonical_examples:
            [
                "روزت بخیر",
                "حالت چطوره",
                "خسته نباشید",
                "خوبی",
                "اوضاع ردیفه؟",
                "احوالت چطوره؟",
                "چه خبر",
                "سلام خوبی",
                "دمت گرم",
                "مرسی",
                "ممنون",
                "مرسی که هستی",
                "خوشحالم که هستی",
                "عزیزمی",
                "دوستت دارم",
                "عاشقتم",
                "عشقمی",
                "فدات شم",
                "عشق منی",
                "عالی",
                "ایول",
            ]
        greeting_responses:
            - "سلام! چطور می‌تونم کمکتون کنم؟"
            - "ممنونم، چه کمکی از دستم بر میاد؟"
            - "سلام، در خدمتم! چه چیزی نیاز دارید؟"
            - "خوشحالم، بفرمایید چطور راهنماییتون کنم؟"
            - "ممنون از محبتتون، چه سوالی دارید؟"
        threshold: 0.93

    compare:
        #کلمات مقایسه
        keywords_fast:
            [
                "مقایسه",
                "فرق",
                "تفاوت",
                "کدوم بهتره",
                "کدوم بهتر",
                "در برابر",
                "vs",
            ]
        canonical_examples: [] # ← خالی؛ پر شدن بر عهدهٔ دامنه
        threshold: 0.86
    refine:
        #کلمات اصلاح کننده فیلترها
        keywords_fast: [
                #قیمت
                "ارزونتر",
                "ارزون‌تر",
                "ارزانتر",
                "ارزان‌تر",
                "اقتصادی‌تر",
                "گران‌تر",
                "گرون تر",
                "گرونتر",
                "گرون‌تر",
                #سایر موارد
                "سبک‌تر",
                "سبکتر",
                "قوی‌تر",
                "قویتر",
                "دیگه",
                "بعدی",
                "یه چیز دیگه",
                "گزینه دیگه",
            ]
        canonical_examples:
            [
                "گران تر نشون بده",
                "گرون ترش رو میخوام",
                "یه چیز ارزونتر نشون بده",
                "گزینه بعدی رو بگو",
                "سبکتر میخوام",
                "قویترش رو میخوام",
            ]
        threshold: 0.92
    search:
        keywords_fast: [] # سرچ پیش‌فرض است؛ نیازی به کلمه کلیدی ندارد
        canonical_examples: [] # ← خالی؛ پر شدن بر عهدهٔ دامنه
        threshold: 0.70 # ‫فقط برای شرکت در رقابت؛ اگر بالاترین نشد، پیش‌فرض search می‌ماند
range_separators: ["تا", "الی", "-", "بین"]

qualitative_mappings:
    price_range:
        budget: [ارزان, ارزان‌تر, ارزون, ارزون‌تر, اقتصادی, بودجه]
        mid: [قیمت مناسب, متوسط, میان‌رده, میان رده]
        flagship: [گران, گرون]
        premium: [بالارده]
    value_for_money:
        excellent: [ارزش خرید بالا]
        good: [به‌صرفه]

conflict_groups:
    - id: price_polarity
      terms:
          - [ارزان, ارزون, ارزون‌تر, ارزان‌تر, اقتصادی, بودجه]
          - [گران, گرون, پرچم‌دار, پرچمدار, لوکس, premium]
      strategy: drop_both

value_conflicts:
    #متضاد هارو چک میکنه مثل ارزون ولی پرچم دار
    price_range:
        - [budget, flagship]
        - [budget, premium]
        - [mid, flagship]

slot_definitions:
    color:
        type: enum
        negation_aware: true
    category:
        type: enum
        negation_aware: true

prompts:
    system_base: |
        تو یک دستیار خرید هوشمند، دقیق و همدل هستی.
        تنها از اطلاعات محصولات ارائه‌شده استفاده کن و هرگز اطلاعاتی ساختگی تولید نکن.
        پاسخ تو باید فقط یک JSON با این ساختار دقیق باشد:
        { "product_ids": [int, int], "explanation": "متن", "next_suggestion": "متن" }
        دستورالعمل‌های پاسخ‌دهی:
        1. اگر محصولی تمام معیارهای کاربر را برآورده کرد، آن را با اعتماد به نفس پیشنهاد بده.
        2. اگر هیچ محصولی دقیقاً مطابق معیارها نبود، نزدیک‌ترین گزینه‌ها را پیشنهاد بده و صادقانه بگو کدام معیارها متفاوت هستند.
        3. هرگز نگو «محصولی یافت نشد» مگر اینکه واقعاً لیست محصولات خالی باشد.
        4. توضیحاتت باید کوتاه، شفاف و مفید باشد (حداکثر ۲-۳ جمله).
        5. در next_suggestion، یک فیلتر یا اقدام عملی پیشنهاد بده که کاربر می‌تواند برای بهبود نتایج انجام دهد.
    templates:
        search: |
            کاربر به دنبال محصولی با این ویژگی‌هاست: $filters
            محصولات بازیابی‌شده:
            $products
            حداکثر ۲ محصول را پیشنهاد بده و دلیل انتخاب را شفاف توضیح بده.
        compare: |
            کاربر می‌خواهد بین محصولات زیر مقایسه‌ای انجام دهد:
            $products
            تفاوت‌های کلیدی، نقاط قوت هرکدام و یک جمع‌بندی نهایی ارائه بده.
        refine: |
            کاربر می‌خواهد نتایج جستجوی قبلی را اصلاح یا محدودتر کند.
            درخواست جدید: $refine_query
            فیلترهای فعلی: $filters
            محصولات پیشنهادی قبلی:
            $products
            با توجه به درخواست جدید، حداکثر ۲ محصول مرتبط‌تر یا جایگزین پیشنهاد بده.
